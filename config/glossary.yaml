# Governed business terms.
# A "decided" term is one rule sentence with an owner and a decision id; its numbers come from
# a versioned parameter set (parameters.yaml) and the system expands it itself (the model only
# names the term). An "open" term has competing definitions and no decision yet, so the marketer
# chooses; the model is told never to guess one.
version: "2026-10-11.1"

terms:
  high_value:
    status: decided
    aliases: [high value, high-value, valuable, top customers, high spenders, alto valor]
    rule: A line is high value when its average monthly revenue over the last three months reaches the high-value threshold.
    decision: {id: D-014, owner: Marketing Analytics, date: 2026-08-12}
    conditions:
      - {attribute: arpu_3m, op: gte, value: {param: high_value.min_arpu_usd}}

  app_user:
    status: decided
    aliases: [app user, app users, uses the app, use the app, using the app, digital customers, usan la app]
    rule: A line is an app user when it opened the self-care app in the last 30 days.
    decision: {id: D-009, owner: Digital Channels, date: 2026-07-30}
    conditions:
      - {attribute: app_active_30d, op: eq, value: true}

  lapsed_prepaid:
    status: decided
    aliases: [lapsed, haven't topped up, stopped recharging, lapsed recharge]
    rule: A prepaid line is lapsed when it has gone longer than the lapse window without a top-up.
    decision: {id: D-021, owner: Prepaid Marketing, date: 2026-09-02}
    conditions:
      - {attribute: line_type, op: eq, value: prepaid}
      - {attribute: days_since_last_recharge, op: gt, value: {param: lapsed_prepaid.min_days_without_topup}}

  heavy_data_user:
    status: decided
    aliases: [heavy data, heavy data users, data-heavy, big data users]
    rule: A line is a heavy data user when its last-30-day data use reaches the heavy-use threshold.
    decision: {id: D-011, owner: Marketing Analytics, date: 2026-08-12}
    conditions:
      - {attribute: data_gb_30d, op: gte, value: {param: heavy_data_user.min_data_gb_30d}}

  new_customer:
    status: decided
    aliases: [new customers, new joiners, recently joined]
    rule: A line is a new customer while its tenure is below the new-customer window.
    decision: {id: D-005, owner: Marketing Analytics, date: 2026-06-18}
    conditions:
      - {attribute: tenure_months, op: lt, value: {param: new_customer.max_tenure_months_exclusive}}

  active:
    status: open
    aliases: [active, active customers, active lines]
    question: '"Active" has two definitions in use and no agreed standard yet. Which one do you mean?'
    owner_pending: Marketing Analytics (decision D-030 open)
    options:
      - id: active_usage
        label: Used the network in the last 30 days (at least one call, SMS or data session)
        conditions:
          - {attribute: usage_events_30d, op: gte, value: 1}
      - id: active_billing
        label: Account in good standing (billing status 'current'); includes silent lines
        conditions:
          - {attribute: billing_status, op: eq, value: current}

  churn_risk:
    status: open
    aliases: [churn risk, likely to churn, at risk of leaving, about to leave]
    question: There is no approved churn model yet. Which governed signal should stand in for it?
    owner_pending: Data Science (churn model on backlog)
    options:
      - id: churn_proxy_overdue
        label: Postpaid lines with an overdue invoice
        conditions:
          - {attribute: line_type, op: eq, value: postpaid}
          - {attribute: billing_status, op: eq, value: overdue}
      - id: churn_proxy_lapsed
        label: Lapsed prepaid lines (no top-up beyond the lapse window)
        conditions:
          - {attribute: line_type, op: eq, value: prepaid}
          - {attribute: days_since_last_recharge, op: gt, value: {param: lapsed_prepaid.min_days_without_topup}}
